spring:
  application:
    name: novaflow-backend

  # 分库分表开关
  shardingsphere:
    enabled: false  # 设为true启用分库分表，会加载application-sharding.yml

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/novaflow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: novaflow
      password: novaflow123
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

  # RocketMQ 配置
  rocketmq:
    name-server: localhost:9876
    producer:
      group: novaflow-producer-group
      send-message-timeout: 3000
      retry-times-when-send-failed: 2
      max-message-size: 4194304  # 4MB
      compress-message-body-threshold: 4096
    consumer:
      group: novaflow-consumer-group
      consume-thread-min: 5
      consume-thread-max: 10
      consume-timeout: 15
      max-reconsume-times: 3  # 最大重试次数
    # 主题配置
    topic:
      video-processing: video-processing-topic
      recommendation: recommendation-topic
    # 消费者组配置
    consumer-group:
      video-upload: video-upload-consumer-group
      video-analysis: video-analysis-consumer-group
      recommendation: recommendation-consumer-group

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.novaflow.infrastructure.persistence.po
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    default-executor-type: REUSE
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 应用配置
app:
  # JWT 配置
  jwt:
    secret: novaflow-jwt-secret-key-change-in-production
    expiration: 604800000  # 7天
    refresh-expiration: 2592000000  # 30天

  # 微信配置
  wechat:
    app-id: your-wechat-app-id
    app-secret: your-wechat-app-secret
    redirect-uri: https://api.novaflow.com/api/v1/auth/wechat/callback

# WxJava 小程序配置
wx:
  miniapp:
    # 多小程序配置
    apps:
      default:
        app-id: ${app.wechat.app-id}
        app-secret: ${app.wechat.app-secret}
        token: ${app.wechat.token:}
        aes-key: ${app.wechat.aes-key:}
        # 配置存储类型（可选：memory, redis, redisson等）
    # 配置存储类型
    config-storage:
      type: memory
      http-client-type: http_components
    # HTTP客户端超时配置
    http-client:
      connection-timeout: 5000
      read-timeout: 10000

# Spring AI 配置
spring:
  ai:
    dashscope:
      # DashScope API Key
      api-key: ${app.ai.tongyi.api-key}
      # Chat Model 配置
      chat:
        options:
          # 模型选择：qwen-max（最强大）、qwen-plus（平衡）、qwen-turbo（快速）
          model: qwen-max
          # 温度参数：控制随机性，0-1之间，越高越随机
          temperature: 0.7
          # 最大token数
          max-tokens: 2000
          # Top-p 采样参数
          top-p: 0.8
          # Top-k 采样参数
          top-k: 50
      # Image Model 配置（用于视频帧分析）
      image:
        options:
          model: qwen-vl-plus
          # 增强模式
          enable-enhancement: true

  # 阿里云 OSS 配置
  aliyun:
    oss:
      endpoint: oss-cn-hangzhou.aliyuncs.com
      access-key-id: your-access-key-id
      access-key-secret: your-access-key-secret
      bucket-name: novaflow-videos

  # 通义千问 AI 配置
  ai:
    tongyi:
      api-key: your-tongyi-api-key
      model: qwen-vl-max
      base-url: https://dashscope.aliyuncs.com/api/v1
      # 系统提示词
      system-prompt: "你是一个智能饮食推荐助手，专门分析视频内容并提供饮食建议。"
      # 聊天记忆配置
      chat:
        memory:
          max-messages: 50  # 保留的最大消息数量
          ttl-hours: 24     # 聊天记录保留时间（小时）

  # 高德地图配置
  amap:
    api-key: your-amap-api-key
    secret-key: your-amap-secret-key

# 日志配置
logging:
  level:
    com.novaflow: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
