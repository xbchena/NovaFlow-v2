spring:
  shardingsphere:
    # 数据源配置
    datasource:
      names: ds0,ds1
      ds0:
        type: com.alibaba.druid.pool.DruidDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/novaflow_0?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: novaflow
        password: novaflow123
      ds1:
        type: com.alibaba.druid.pool.DruidDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/novaflow_1?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: novaflow
        password: novaflow123

    # 规则配置
    rules:
      # 分片规则
      sharding:
        # 表配置
        tables:
          # 用户表分片配置
          user:
            actual-data-nodes: ds$->{0..1}.user_$->{0..3}
            database-strategy:
              standard:
                sharding-column: id
                sharding-algorithm-name: user_db_mod
            table-strategy:
              standard:
                sharding-column: id
                sharding-algorithm-name: user_table_mod

          # 视频表分片配置
          video:
            actual-data-nodes: ds$->{0..1}.video_$->{0..3}
            database-strategy:
              standard:
                sharding-column: user_id
                sharding-algorithm-name: video_db_mod
            table-strategy:
              standard:
                sharding-column: user_id
                sharding-algorithm-name: video_table_mod

          # 推荐表分片配置
          recommendation:
            actual-data-nodes: ds$->{0..1}.recommendation_$->{0..3}
            database-strategy:
              standard:
                sharding-column: user_id
                sharding-algorithm-name: recommendation_db_mod
            table-strategy:
              standard:
                sharding-column: user_id
                sharding-algorithm-name: recommendation_table_mod

          # 用户选择记录表分片配置
          user_selection:
            actual-data-nodes: ds$->{0..1}.user_selection_$->{0..3}
            database-strategy:
              standard:
                sharding-column: user_id
                sharding-algorithm-name: selection_db_mod
            table-strategy:
              standard:
                sharding-column: user_id
                sharding-algorithm-name: selection_table_mod

        # 分片算法配置
        sharding-algorithms:
          # 用户表数据库分片算法（按ID取模）
          user_db_mod:
            type: MOD
            props:
              sharding-count: 2

          # 用户表分表算法（按ID取模）
          user_table_mod:
            type: MOD
            props:
              sharding-count: 4

          # 视频表数据库分片算法
          video_db_mod:
            type: MOD
            props:
              sharding-count: 2

          # 视频表分表算法
          video_table_mod:
            type: MOD
            props:
              sharding-count: 4

          # 推荐表数据库分片算法
          recommendation_db_mod:
            type: MOD
            props:
              sharding-count: 2

          # 推荐表分表算法
          recommendation_table_mod:
            type: MOD
            props:
              sharding-count: 4

          # 选择记录表数据库分片算法
          selection_db_mod:
            type: MOD
            props:
              sharding-count: 2

          # 选择记录表分表算法
          selection_table_mod:
            type: MOD
            props:
              sharding-count: 4

    # 属性配置
    props:
      # 显示SQL
      sql-show: true
      # 简单类型的分片键使用行级表达式
      check-table-metadata-enabled: true
