server:
  port: 8081

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/novaflow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: novaflow
      password: novaflow123
      initial-size: 5
      min-idle: 5
      max-active: 20
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.novaflow.auth.infra.persistence.po
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${NOVAFLOW_JWT_SECRET:novaflow-jwt-secret-change-me-please-256bit-key}
    expiration: 604800000
    refresh-expiration: 2592000000
  wechat:
    app-id: your-wechat-app-id
    app-secret: your-wechat-app-secret
    redirect-uri: https://api.novaflow.com/api/v1/auth/wechat/callback

wx:
  miniapp:
    apps:
      default:
        app-id: ${app.wechat.app-id}
        app-secret: ${app.wechat.app-secret}
    config-storage:
      type: memory
      http-client-type: http_components
    http-client:
      connection-timeout: 5000
      read-timeout: 10000

logging:
  level:
    com.novaflow.auth: debug
    org.springframework.web: info
