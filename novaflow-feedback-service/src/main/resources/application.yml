server:
  port: 8084

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/novaflow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: novaflow
      password: novaflow123
  data:
    redis:
      host: localhost
      port: 6379
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.novaflow.feedback.infra.persistence.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.novaflow.feedback: debug

rocketmq:
  name-server: localhost:9876
  producer:
    group: novaflow-feedback-producer-group
  topic:
    recommendation: recommendation-topic
