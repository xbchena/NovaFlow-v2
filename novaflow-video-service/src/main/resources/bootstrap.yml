spring:
  application:
    name: novaflow-video-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
        shared-configs:
          - data-id: novaflow-common.yaml
            group: DEFAULT_GROUP
            refresh: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
