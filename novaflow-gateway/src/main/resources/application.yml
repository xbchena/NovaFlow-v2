server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        # Auth Service
        - id: auth-service
          uri: lb://novaflow-auth-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/user/**
          filters:
            - StripPrefix=0
        # Video Service
        - id: video-service
          uri: lb://novaflow-video-service
          predicates:
            - Path=/api/v1/videos/**
          filters:
            - StripPrefix=0
        # Recommendation Service
        - id: recommendation-service
          uri: lb://novaflow-recommendation-service
          predicates:
            - Path=/api/v1/recommendations/**,/api/v1/chat/**,/api/v1/profile/**,/api/v1/locations/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"
        # Feedback Service
        - id: feedback-service
          uri: lb://novaflow-feedback-service
          predicates:
            - Path=/api/v1/feedback/**
          filters:
            - StripPrefix=0
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_UNIQUE
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

gateway:
  jwt-secret: ${NOVAFLOW_JWT_SECRET:novaflow-jwt-secret-change-me-please-256bit-key}
  blacklist-prefix: auth:blacklist
  whitelist:
    - /api/v1/auth/wechat/callback
    - /api/v1/auth/wechat/miniprogram/login
    - /api/v1/auth/phone/login
    - /api/v1/auth/send-code
    - /api/v1/auth/refresh
    - /actuator/health

logging:
  level:
    com.novaflow.gateway: debug
